---
# tasks file for systemd-journal-remote
#

- name: Include OS-specific variables.
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Include distribution and version-specific vars.
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
      skip: true

- name: Check the presence of all mandatory variables
  ansible.builtin.include_tasks: check_mandatory_vars.yml

- name: Install the systemd-journal-remote package
  ansible.builtin.package:
    name: "{{ __systemd_journal_remote_package }}"
    state: present

- name: Create systemd-journal-remote group
  ansible.builtin.group:
    name: systemd-journal-remote
    state: present

- name: Create systemd-journal-remote user
  ansible.builtin.user:
    name: systemd-journal-remote
    group: systemd-journal-remote
    shell: /sbin/nologin
    system: true
    create_home: false
    state: present

- name: Ensure /var/log/journal/remote directory exists
  ansible.builtin.file:
    path: /var/log/journal/remote
    state: directory
    owner: systemd-journal-remote
    group: systemd-journal-remote
    mode: '0755'

- name: Template systemd-journal-remote configuration file
  ansible.builtin.template:
    src: systemd-journal-remote.conf.j2
    dest: /etc/systemd/journal-remote.conf
    owner: systemd-journal-remote
    group: systemd-journal-remote
    mode: '0640'
  notify:
    - Reload systemd
    - Restart systemd-journal-remote.service
    - Restart systemd-journal-remote.socket

- name: Enable systemd-journal-remote services
  ansible.builtin.systemd:
    name: '{{ item }}'
    enabled: true
  loop:
    - systemd-journal-remote.service
    - systemd-journal-remote.socket
